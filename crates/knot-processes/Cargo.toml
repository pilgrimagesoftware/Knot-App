[package]
name = "knot-processes"
version = "1.34.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
parking_lot.workspace = true
thiserror.workspace = true

[features]
# Exposes `test_seams` for this crate's own integration tests; see lib.rs.
# Never enabled by a dependent: a normal build does not compile the module.
test-seams = []

[dev-dependencies]
tempfile.workspace = true
# The crate itself, with its test seams, for tests/*.rs.
knot-processes = { path = ".", features = ["test-seams"] }
