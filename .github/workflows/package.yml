name: Package

# Builds the installable Knot.app and DMG with cargo-packager, the way the
# other pilgrimagesoftware Rust apps do it (see dtrpg-app.rs package.yaml).
#
# Runs on every merge into develop, keeping the result as a workflow artifact,
# and is called by release.yml with a tag, which also attaches the DMG, its
# CycloneDX SBOM and a SHA256SUMS file to the GitHub Release. The Linux
# tar.gz and Windows zip are plain archives of the release binary, each with
# its own `.sha256` file, so no job overwrites another's checksums.

on:
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the packages to. Empty to only keep them as an artifact."
        type: string
        default: ""
      ref:
        description: "Git ref to build. Defaults to the ref that triggered the caller."
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# A merge into develop supersedes the build in flight for the one before it; a
# release build has its own group and is never cancelled.
concurrency:
  group: package-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  package:
    name: Package (macOS)
    # macos-latest runners are Apple Silicon. The .app and DMG need AppKit
    # and cargo-packager's macOS bundlers; Linux and Windows get archives from
    # the jobs below.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-darwin
          cache-key: package

      - name: Install cargo-packager and cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          # cargo-cyclonedx is pinned: its output format and file naming
          # (`--override-filename`, one file per member) are what the SBOM step
          # below relies on.
          tool: cargo-packager,cargo-cyclonedx@0.5.9

      # cargo-packager resolves `[package.metadata.packager]` from the manifest
      # in the current directory, not from a workspace root with `--packages`
      # (see the same note in dtrpg-app.rs package.yaml).
      - name: Package
        working-directory: crates/knot
        env:
          # macOS Developer ID signing/notarization credentials. While unset the
          # .app and dmg get the ad-hoc signature `crates/knot/Cargo.toml` configures.
          # cargo-packager reads the certificate and notarization values from
          # the environment, but the identity only from its config, so the
          # script below writes APPLE_SIGNING_IDENTITY into the manifest.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # `before-packaging-command` runs a plain `cargo build` with no
          # `--target`, which would write to target/release while packaging
          # looks under target/<triple>/release.
          CARGO_BUILD_TARGET: aarch64-apple-darwin
        run: |
          # A secret that isn't set still arrives as an empty variable, and
          # cargo-packager treats a present-but-empty APPLE_CERTIFICATE as a
          # certificate to import, which fails. Unset the empty ones.
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!var}" ] || unset "$var"
          done
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            perl -pi -e 's/^signing-identity = "-"$/signing-identity = "$ENV{APPLE_SIGNING_IDENTITY}"/' Cargo.toml
            grep -qxF "signing-identity = \"$APPLE_SIGNING_IDENTITY\"" Cargo.toml || {
              echo "::error::could not set the Developer ID identity in crates/knot/Cargo.toml"
              exit 1
            }
          fi
          cargo packager \
            --release \
            --target aarch64-apple-darwin \
            --formats app,dmg \
            --verbose

      # Fails the job on a missing or broken signature, on the .app itself and
      # on the copy a user actually installs from the dmg. `--deep` here only
      # verifies nested code; signing never uses it.
      - name: Verify macOS signatures
        run: |
          set -euo pipefail
          out=target/aarch64-apple-darwin/release
          app="$out/Knot.app"
          dmg=$(ls "$out"/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$dmg"
          mnt=$(mktemp -d)
          # The dmg carries LICENSE.md as a license agreement, which hdiutil
          # pages and asks to accept; without the `yes` it cancels the attach.
          # Fed by process substitution, not a pipe: `yes` dies of SIGPIPE once
          # hdiutil stops reading, which `pipefail` would report as a failure.
          PAGER=cat hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" < <(yes) >/dev/null
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mnt/Knot.app"
          codesign -dv "$mnt/Knot.app"

      # The SBOM describes the `knot` crate, which depends on every other
      # workspace crate, so it lists everything compiled into the app. It is
      # named after the dmg, and SHA256SUMS covers both, in the format
      # `shasum -a 256 -c SHA256SUMS` checks.
      - name: SBOM and checksums
        run: |
          set -euo pipefail
          out=target/aarch64-apple-darwin/release
          dmgs=("$out"/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "::error::expected exactly one dmg in $out, found: ${dmgs[*]}"
            exit 1
          fi
          name=$(basename "${dmgs[0]}" .dmg)
          # cargo-cyclonedx writes one file beside every workspace member's
          # manifest; only the app's is kept.
          cargo cyclonedx \
            --manifest-path crates/knot/Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --target aarch64-apple-darwin \
            --no-build-deps \
            --override-filename sbom
          mv crates/knot/sbom.json "$out/$name.cdx.json"
          find crates -name sbom.json -delete
          cd "$out"
          shasum -a 256 "$name.dmg" "$name.cdx.json" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Knot-macOS-${{ github.run_number }}
          path: |
            target/aarch64-apple-darwin/release/*.dmg
            target/aarch64-apple-darwin/release/*.cdx.json
            target/aarch64-apple-darwin/release/SHA256SUMS
            target/aarch64-apple-darwin/release/*.app
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            target/aarch64-apple-darwin/release/*.dmg \
            target/aarch64-apple-darwin/release/*.cdx.json \
            target/aarch64-apple-darwin/release/SHA256SUMS \
            --clobber

  # A tar.gz / zip of the release binary rather than cargo-packager bundles:
  # the packager's deb/AppImage/NSIS formats have not been run against Knot,
  # and an archive is what a Homebrew formula or a manual install needs.
  archive:
    name: Archive (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang libfontconfig-dev libwayland-dev \
            libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libssl-dev libzstd-dev

      - name: Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache-key: archive-${{ matrix.target }}

      - name: Build
        run: cargo build --release --package knot --target ${{ matrix.target }}

      - name: Archive and checksum
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "knot") | .version')
          name="Knot_${version}_${{ matrix.target }}"
          bin=target/${{ matrix.target }}/release/knot
          [ "$RUNNER_OS" = Windows ] && bin="$bin.exe"
          stage="dist/$name"
          mkdir -p "$stage"
          cp "$bin" LICENSE.md README.md "$stage/"
          cd dist
          if [ "${{ matrix.ext }}" = zip ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          sha256sum "$name.${{ matrix.ext }}" > "$name.${{ matrix.ext }}.sha256"
          cat "$name.${{ matrix.ext }}.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Knot-${{ matrix.name }}-${{ github.run_number }}
          path: |
            dist/*.${{ matrix.ext }}
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.${{ matrix.ext }} dist/*.sha256 --clobber
