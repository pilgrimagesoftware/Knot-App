name: Release

permissions:
  contents: write
  # rust-release.yaml uses OIDC for crates.io publishing, so the reusable
  # workflow call requires the id-token permission on this caller too.
  id-token: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release:
    uses: pilgrimagesoftware/github-actions/.github/workflows/rust-release.yaml@master
    with:
      tag: ${{ inputs.tag }}
      # `--exclude knot` keeps the test *binary* for the `knot` crate from
      # building, but its workspace dependencies (gpui and friends) still
      # need to compile to resolve the workspace graph, and gpui's system
      # libraries (fontconfig, wayland, webkit, xkbcommon) aren't on the
      # reusable workflow's runner by default. ci.yml already runs the whole
      # workspace, including `knot`, on both Linux and macOS for every push
      # and PR, so this list only needs to satisfy the build, not the test.
      test-args: "--workspace --exclude knot"
      linux-packages: >-
        gcc g++ clang libfontconfig-dev libwayland-dev
        libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev
        libssl-dev libzstd-dev
      publish-to-crates-io: false
      release-branch: main
      merge-back-branch: develop
    secrets:
      PSW_CI_APP_ID: ${{ secrets.PSW_CI_APP_ID }}
      PSW_CI_PRIVATE_KEY: ${{ secrets.PSW_CI_PRIVATE_KEY }}

  # Packages Knot.app for the released tag and attaches the DMG to the release
  # the job above created.
  package:
    needs: release
    uses: ./.github/workflows/package.yml
    with:
      tag: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
    secrets: inherit

  # Writes the released version and the DMG's checksum into the Homebrew tap's
  # `Casks/knot-ai.rb`, rendered from packaging/homebrew/knot-ai.rb.in. Needs
  # the `pilgrimagesoftware/homebrew-tap` repo and the PSW CI GitHub App
  # installed on it with contents: write.
  homebrew:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}

      - name: Tap token
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PSW_CI_APP_ID }}
          private-key: ${{ secrets.PSW_CI_PRIVATE_KEY }}
          owner: pilgrimagesoftware
          repositories: homebrew-tap

      - name: Render the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          sha=$(awk -v f="Knot_${version}_aarch64.dmg" '$2 == f { print $1 }' SHA256SUMS)
          [ -n "$sha" ] || { echo "::error::no checksum for Knot_${version}_aarch64.dmg"; exit 1; }
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sha/" \
            packaging/homebrew/knot-ai.rb.in > tap/Casks/knot-ai.rb
          cat tap/Casks/knot-ai.rb

      - name: Push to the tap
        env:
          TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TOKEN}@github.com/pilgrimagesoftware/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Casks
          cp tap/Casks/knot-ai.rb tap-repo/Casks/knot-ai.rb
          cd tap-repo
          git config user.name "psw-ci[bot]"
          git config user.email "psw-ci[bot]@users.noreply.github.com"
          git add Casks/knot-ai.rb
          git diff --cached --quiet && { echo "cask already current"; exit 0; }
          git commit -m "chore(knot-ai): update to ${TAG#v}"
          git push
