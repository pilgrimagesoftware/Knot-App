<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <style>.sidebar { display: flex; flex-direction: column; gap: .65rem; } .sidebar a { display: block; } .header-logo { height: 2rem; object-fit: contain; width: 2rem; }</style>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/latest/' | relative_url }}" aria-label="Knot documentation home"><img class="header-logo" src="{{ '/assets/icons/knot-icon.png' | relative_url }}" alt=""><span>Knot</span></a>
      {% include version-selector.html %}
    </header>
    <div class="shell">
      <nav class="sidebar" aria-label="Documentation"><a href="{{ '/latest/' | relative_url }}">Overview</a><a href="{{ '/latest/install/' | relative_url }}">Installation</a></nav>
      <main id="content">{{ content }}</main>
    </div>
  </body>
</html>
