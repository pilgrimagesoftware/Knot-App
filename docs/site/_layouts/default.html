<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/latest/' | relative_url }}" aria-label="Knot documentation home"><span class="brand-mark" aria-hidden="true">K</span><span>Knot</span></a>
      {% include version-selector.html %}
    </header>
    <div class="shell">
      <nav class="sidebar" aria-label="Documentation"><a href="{{ '/latest/' | relative_url }}">Overview</a></nav>
      <main id="content">{{ content }}</main>
    </div>
  </body>
</html>
